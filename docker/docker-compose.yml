version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: dremio_optimizer_db
    environment:
      POSTGRES_DB: dremio_optimizer
      POSTGRES_USER: dremio_admin
      POSTGRES_PASSWORD: dremio_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dremio_admin"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dremio_network

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: dremio_optimizer_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@dremio.local
      PGADMIN_DEFAULT_PASSWORD: admin_password
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - dremio_network

volumes:
  postgres_data:

networks:
  dremio_network:
    driver: bridge
